<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Druckerei</title>
    <!-- Zum Home-Bildschirm hinzufügen: läuft dann im Vollbild ohne Browserleiste. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%grafik/symbol_home_180.png" />
    <link rel="icon" href="%BASE_URL%grafik/symbol_home_192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Druckerei" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#2b3445" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2b3445;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body { position: fixed; inset: 0; }
      /* Rahmen hält Notch und Home-Balken frei. */
      #rahmen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100dvh;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        display: flex;
      }
      #platz { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
      #spiel { width: 320px; height: 180px; }
      #spiel canvas { display: block; }
      #drehen {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #2b3445;
        color: #ffffff;
        font: 20px/1.4 system-ui, -apple-system, sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      @media (orientation: portrait) {
        #drehen { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="rahmen"><div id="platz"><div id="spiel"></div></div></div>
    <div id="drehen">Bitte das Gerät drehen.<br />Das Spiel läuft im Querformat.</div>
    <script type="module" src="/src/spiel/main.ts"></script>
  </body>
</html>
