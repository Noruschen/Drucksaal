<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Druckerei: vier Designs</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
        background: #14171f;
        color: #e8ebf2;
        font: 16px/1.4 system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .einleitung { margin: 0 0 16px; color: #aab2c2; }
      #raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 24px; }
      .variante { min-width: 0; }
      .variante h2 { font-size: 16px; margin: 0 0 8px; }
      .variante p { margin: 8px 0 0; font-size: 14px; color: #c4cad6; }
      .variante .faktor { font-size: 12px; color: #7f8899; margin-top: 2px; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <h1>Pixelart-Spiel «Druckerei»: vier Designs zur Auswahl</h1>
    <p class="einleitung">
      Jede Variante zeigt denselben Ausschnitt in 320 x 180 Spielpixeln: Drucksaal mit Digitaldruck, SM 52 und RA 76
      (steht, rüstet, druckt), eine Lauftasche, eine Schaltfläche und eine Testzeile in der Pixelschrift.
      Am iPhone bitte quer halten.
    </p>
    <div id="raster"></div>
    <script type="module" src="/src/designs/main.ts"></script>
  </body>
</html>
